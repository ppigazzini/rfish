[package]
name = "rfish-engine"
description = "The rfish chess engine: board, search, evaluation, tablebases. No I/O, no UCI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No dependencies. Not "few" -- none. See the note in the workspace manifest.
[dependencies]

[features]
# MEASUREMENT HARNESS, never a build mode. Replaces the per-node evaluation with a
# material sum, so a differential against an oracle patched with the SAME formula
# measures the search spine -- movegen, movepick, the histories, the TT, the pruning
# arithmetic -- instead of reading it through the network. The binary it produces plays
# badly by construction and moves the bench anchor, so no gate accepts it.
eval-material = []

[lints]
workspace = true

[lib]
# `bench` shadows the harness the engine does not use; the gates drive the binary
# and `cargo bench` would only add a second, unmeasured path to the same code.
bench = false
