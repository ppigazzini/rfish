name: rfish parity

# Every lane below runs a gate that also exists locally, and nothing local is weaker than
# what runs here: a contributor who sees a green `cargo xtask parity` should not be
# surprised by the merge gate. See docs/10-tooling-ci.md.
#
# Every third-party action is pinned BY COMMIT SHA, with the tag in a trailing comment. A
# tag is a mutable pointer -- the owner can move `v7` to anything -- so a tag-pinned action is
# an unreviewed dependency that can change under a merge gate. These are the same pins the
# sibling ports (`../zfish`, `../mcfish`) and `../valgebra` carry, so a bump is decided once
# and applied across all four. The toolchain is not an action at all: every lane installs it
# through `.github/actions/setup-rust`, which runs rustup itself. See docs/10-tooling-ci.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed by event too, so a push to main does not share a group with a scheduled run and
  # cancel it mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format, clippy and the unsafe gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # From rust-toolchain.toml, never repeated here. That file OVERRIDES whatever the
        # action installs, so a hard-coded channel in this workflow would install one
        # toolchain and then silently run a different one -- with the wrong components.
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      # Formatting first: it is the cheapest gate and it blocks everything after it, so a
      # whitespace mistake is reported in seconds rather than after a two-minute bench.
      - run: cargo xtask fmt
      - run: cargo xtask clippy
      # The port's defining constraint, asserted from outside the manifest that enforces it.
      - run: cargo xtask unsafe-lint
      - run: cargo xtask docs-lint

  # The workflows themselves, statically: template injection, persisted credentials,
  # over-broad permissions and unpinned actions. The token lets zizmor resolve each pinned
  # SHA against its tag comment (the online audits, `ref-version-mismatch` among them) beside
  # the static ones. The version is pinned, as ../valgebra pins it, so a zizmor release
  # cannot redden a tree nothing changed.
  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.33.0 .github/

  actions-lock:
    name: Actions lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # `.github/workflows/actions.lock` names the commit every action a workflow
    # runs resolves to, an action another action calls included, and the runner
    # runs that commit. This reads the file against the workflows and against
    # upstream: a `uses:` with no entry, or a tag moved off its locked commit,
    # fails here.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the lockfile checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  test:
    # Named per ROW rather than per runner label, as ../zfish's native-os lane is: the label
    # says which image GitHub boots, and the architecture it boots on is the thing a reader
    # of a red lane needs -- `macos-26` boots aarch64, and only `macos-26-intel` boots x86-64.
    # Every label names its image rather than a `-latest` alias, so no image moves under a lane.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: Linux x86-64 test
          - os: macos-26
            name: macOS aarch64 test
          - os: windows-2025
            name: Windows x86-64 test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # From rust-toolchain.toml, never repeated here. That file OVERRIDES whatever the
        # action installs, so a hard-coded channel in this workflow would install one
        # toolchain and then silently run a different one -- with the wrong components.
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@v2.9.3
      # The `gate` profile: release code generation PLUS the debug assertions the search
      # states its invariants with. A release-only run turns a violated invariant into a
      # plausible wrong number instead of a failure.
      - run: cargo xtask test

  parity:
    name: Linux x86-64 parity
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # From rust-toolchain.toml, never repeated here. That file OVERRIDES whatever the
        # action installs, so a hard-coded channel in this workflow would install one
        # toolchain and then silently run a different one -- with the wrong components.
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@v2.9.3
      # The network is a runtime input, not a build product, and the signature is measured
      # WITH it. Keyed by the module that names it: a net never changes content under a
      # name, so a hit is always valid and a miss only happens on an upstream net swap.
      - uses: actions/cache@v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: cargo xtask net
      # The 3-man Syzygy set, ~26 KiB, cached the way both sibling ports cache theirs; KPvKP,
      # ~300 KiB, which `tb` differences for the DTZ remap no 3-man file reaches; and with
      # `tb-fetch 5` the same 5-man set ../mcfish's parity lane fetches, 24 MB: KNNvKP and
      # the two children its DTZ walk recurses into, the only tables that hold a DTZ past
      # 100. The `tbcursed` golden case reads it -- the cursed-win and blessed-loss probes
      # and mcfish's two node-limited TB searches. Keyed on the fetcher so a source or set
      # change re-downloads. Without them the tablebase-dependent golden cases SKIP, and a
      # case that can only skip in CI is a case nobody notices breaking.
      # Restore and save are split, as ../mcfish's are, so that only a COMPLETE fetch is
      # saved: a key that hits is never saved again, so caching what an outage left behind
      # would pin the partial set until the fetcher next changed.
      - name: Restore the Syzygy tables
        id: tbcache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            resources/syzygy
            resources/syzygy4
            resources/syzygy5
          key: syzygy-3man-kpvkp-5man-${{ hashFiles('crates/xtask/src/net.rs') }}
      # BEST EFFORT, as ../mcfish's blocking lane fetches: a tablebase mirror is not this
      # project's dependency to be held hostage by. A failed fetch shows on this step, and
      # the gates narrow exactly as they do on a developer's machine -- the tbpv case
      # SKIPS and says so -- so the lane stays green on the half it can still prove.
      - name: Fetch the tablebases (best effort; the gates narrow without them)
        id: tbfetch
        continue-on-error: true
        timeout-minutes: 15
        run: cargo xtask tb-fetch 5
      - name: Save the Syzygy tables
        if: steps.tbfetch.outcome == 'success' && steps.tbcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            resources/syzygy
            resources/syzygy4
            resources/syzygy5
          key: syzygy-3man-kpvkp-5man-${{ hashFiles('crates/xtask/src/net.rs') }}
      # perft counts are facts about chess; golden pins the UCI surface byte for byte;
      # signature is the anchor. Each exits 2 if it could not run, which fails the step --
      # a skipped gate must never read as a pass.
      - run: cargo xtask perft
      - run: cargo xtask golden
      - run: cargo xtask signature
      # `nnue-check` and `tb` are deliberately NOT steps here. Both need a pristine upstream
      # BUILD as well as their data files, and a gate that can only SKIP in CI teaches
      # contributors to ignore a skip. They run locally, and `cargo xtask parity` names them
      # when it could not run them.

  # Both sibling ports gate on a race detector and on valgrind; this port did not, and
  # `forbid(unsafe_code)` is not an answer to either. It rules out the pointer mistakes a C++
  # port fears and rules out nothing about ATOMICS -- the shared table, the stop flag and the
  # node counters are `Relaxed` by design, and an ordering that is too weak is a logic bug the
  # type system is happy with.
  tsan-race:
    name: Linux TSan race gate
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
          # `std` is rebuilt from source under the sanitizer, so its source must be present.
          components: rust-src
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/cache@v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: cargo xtask net
      - run: cargo xtask tsan

  # `signature` builds at the DEFAULT arch, so it only ever tests the portable arm -- and the
  # NNUE kernels are `std::simd`, whose lowering the target-cpu tier decides. An ISA-gated
  # divergence is therefore invisible to the anchor and to every other gate here. This is the
  # only lane that can see one, and both sibling ports run their equivalent in the blocking
  # lane for exactly that reason. Measured at 90s locally over all five tiers, which is what
  # makes it affordable to block on.
  #
  # It benches only the tiers THIS RUNNER can execute, and the hosted fleet is mixed: an AMD
  # runner has no AVX-512, so the three 512-bit tiers build there and cannot be driven. That
  # is what `--host-tiers` accepts, and the gate names every tier it left unbenched rather
  # than counting it checked. Full five-tier coverage is a LOCAL run on an AVX-512 box.
  arch-determinism:
    name: Every tier builds, and every tier the runner can execute benches the anchor
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/cache@v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: cargo xtask net
      # A BENCH is a native run: a binary built at `-C target-cpu=skylake-avx512` raises
      # SIGILL on a runner without AVX-512, which is a fact about the fleet rather than about
      # the anchor. This lane's first run died exactly there.
      - run: cargo xtask arch-determinism --host-tiers

  valgrind:
    name: Linux valgrind memcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/cache@v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo xtask net
      - run: cargo xtask build
      # A SHORT bench: valgrind is ~50x, and the property being checked -- that the engine
      # touches no memory it should not -- does not need depth.
      - name: Search under memcheck
        working-directory: resources
        run: valgrind --error-exitcode=42 --leak-check=summary ../target/release/stockfish bench 16 1 5

  # NO msrv lane. It ran `cargo +<rust-version> build` and that cannot pass: the engine
  # enables `portable_simd`, which is rejected outright on a stable channel, so the lane
  # would fail on its first line for a reason no contributor could act on. The toolchain
  # requirement is now a PIN rather than a floor -- `rust-toolchain.toml` names one dated
  # nightly and every lane above reads it from there -- and a floor lane tests nothing a
  # pin does not already fix. See docs/10-tooling-ci.md.

  # NO cross-build lane. It ran `cargo check --target` for aarch64-unknown-linux-gnu and
  # x86_64-pc-windows-gnu to catch a `cfg` creeping into engine code, and the `test` matrix
  # above already compiles AND tests the engine natively on aarch64 (macOS) and on Windows.
  # The engine's only platform conditionals are `cfg!(windows)` (the SyzygyPath separator)
  # and x86 `target_feature`s, and each reads the same on windows-gnu as on the Windows row
  # and on aarch64-linux as on the macOS row. See docs/10-tooling-ci.md.
