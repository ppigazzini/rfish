name: rfish parity

# Every lane below runs a gate that also exists locally, and nothing local is weaker than
# what runs here: a contributor who sees a green `cargo xtask parity` should not be
# surprised by the merge gate. See docs/09-tooling-ci.md.
#
# Every action is pinned BY COMMIT SHA, with the tag in a trailing comment. A tag is a
# mutable pointer -- the owner can move `v7` to anything -- so a tag-pinned action is an
# unreviewed dependency that can change under a merge gate. These are the same pins the
# sibling ports (`../zfish`, `../mcfish`) and `../valgebra` carry, so a bump is decided once
# and applied across all four.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed by event too, so a push to main does not share a group with a scheduled run and
  # cancel it mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format, clippy and the unsafe gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # From rust-toolchain.toml, never repeated here. That file OVERRIDES whatever the
        # action installs, so a hard-coded channel in this workflow would install one
        # toolchain and then silently run a different one -- with the wrong components and,
        # in the cross lane, without the target's std.
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Formatting first: it is the cheapest gate and it blocks everything after it, so a
      # whitespace mistake is reported in seconds rather than after a two-minute bench.
      - run: cargo xtask fmt
      - run: cargo xtask clippy
      # The port's defining constraint, asserted from outside the manifest that enforces it.
      - run: cargo xtask unsafe-lint
      - run: cargo xtask docs-lint

  test:
    # Named per ROW rather than per runner label, as ../zfish's native-os lane is: the label
    # says which image GitHub boots, and the architecture it boots on is the thing a reader
    # of a red lane needs -- `macos-latest` has been aarch64 since the Intel images retired.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86-64 test
          - os: macos-latest
            name: macOS aarch64 test
          - os: windows-latest
            name: Windows x86-64 test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # From rust-toolchain.toml, never repeated here. That file OVERRIDES whatever the
        # action installs, so a hard-coded channel in this workflow would install one
        # toolchain and then silently run a different one -- with the wrong components and,
        # in the cross lane, without the target's std.
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The `gate` profile: release code generation PLUS the debug assertions the search
      # states its invariants with. A release-only run turns a violated invariant into a
      # plausible wrong number instead of a failure.
      - run: cargo xtask test

  parity:
    name: Linux x86-64 parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # From rust-toolchain.toml, never repeated here. That file OVERRIDES whatever the
        # action installs, so a hard-coded channel in this workflow would install one
        # toolchain and then silently run a different one -- with the wrong components and,
        # in the cross lane, without the target's std.
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The network is a runtime input, not a build product, and the signature is measured
      # WITH it. Keyed by the module that names it: a net never changes content under a
      # name, so a hit is always valid and a miss only happens on an upstream net swap.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: cargo xtask net
      # The 3-man Syzygy set, ~26 KiB, cached the way both sibling ports cache theirs and
      # keyed on the fetcher so a source or set change re-downloads. Without it the
      # tablebase-dependent golden case SKIPS, and a case that can only skip in CI is a case
      # nobody notices breaking.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/syzygy
          key: syzygy-3man-${{ hashFiles('crates/xtask/src/net.rs') }}
      - run: cargo xtask tb-fetch
      # perft counts are facts about chess; golden pins the UCI surface byte for byte;
      # signature is the anchor. Each exits 2 if it could not run, which fails the step --
      # a skipped gate must never read as a pass.
      - run: cargo xtask perft
      - run: cargo xtask golden
      - run: cargo xtask signature
      # `nnue-check` and `tb` are deliberately NOT steps here. Both need a pristine upstream
      # BUILD as well as their data files, and a gate that can only SKIP in CI teaches
      # contributors to ignore a skip. They run locally, and `cargo xtask parity` names them
      # when it could not run them.

  # Both sibling ports gate on a race detector and on valgrind; this port did not, and
  # `forbid(unsafe_code)` is not an answer to either. It rules out the pointer mistakes a C++
  # port fears and rules out nothing about ATOMICS -- the shared table, the stop flag and the
  # node counters are `Relaxed` by design, and an ordering that is too weak is a logic bug the
  # type system is happy with.
  tsan-race:
    name: Linux TSan race gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
          # `std` is rebuilt from source under the sanitizer, so its source must be present.
          components: rust-src
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: cargo xtask net
      - run: cargo xtask tsan

  # `signature` builds at the DEFAULT arch, so it only ever tests the portable arm -- and the
  # NNUE kernels are `std::simd`, whose lowering the target-cpu tier decides. An ISA-gated
  # divergence is therefore invisible to the anchor and to every other gate here. This is the
  # only lane that can see one, and both sibling ports run their equivalent in the blocking
  # lane for exactly that reason. Measured at 90s locally over all five tiers, which is what
  # makes it affordable to block on.
  #
  # It benches only the tiers THIS RUNNER can execute, and the hosted fleet is mixed: an AMD
  # runner has no AVX-512, so the three 512-bit tiers build there and cannot be driven. That
  # is what `--host-tiers` accepts, and the gate names every tier it left unbenched rather
  # than counting it checked. Full five-tier coverage is a LOCAL run on an AVX-512 box.
  arch-determinism:
    name: Every tier builds, and every tier the runner can execute benches the anchor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: cargo xtask net
      # A BENCH is a native run: a binary built at `-C target-cpu=skylake-avx512` raises
      # SIGILL on a runner without AVX-512, which is a fact about the fleet rather than about
      # the anchor. This lane's first run died exactly there.
      - run: cargo xtask arch-determinism --host-tiers

  valgrind:
    name: Linux valgrind memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo xtask net
      - run: cargo xtask build
      # A SHORT bench: valgrind is ~50x, and the property being checked -- that the engine
      # touches no memory it should not -- does not need depth.
      - name: Search under memcheck
        working-directory: resources
        run: valgrind --error-exitcode=42 --leak-check=summary ../target/release/stockfish bench 16 1 5

  # NO msrv lane. It ran `cargo +<rust-version> build` and that cannot pass: the engine
  # enables `portable_simd`, which is rejected outright on a stable channel, so the lane
  # would fail on its first line for a reason no contributor could act on. The toolchain
  # requirement is now a PIN rather than a floor -- `rust-toolchain.toml` names one dated
  # nightly and every lane above reads it from there -- and a floor lane tests nothing a
  # pin does not already fix. See docs/09-tooling-ci.md.

  cross-build:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # From rust-toolchain.toml, never repeated here. That file OVERRIDES whatever the
        # action installs, so a hard-coded channel in this workflow would install one
        # toolchain and then silently run a different one -- with the wrong components and,
        # in the cross lane, without the target's std.
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # `check`, not `build`: the runner has no cross LINKER for either target, so a build
      # fails at the link step having already proven everything this lane is for. What it is
      # for is catching a `cfg` sneaking into engine code -- the engine's only real platform
      # differences are the SyzygyPath separator and the binary's extension.
      - run: cargo check --workspace --all-targets --target ${{ matrix.target }}
