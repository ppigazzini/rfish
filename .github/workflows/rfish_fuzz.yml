name: fuzz

# Scheduled, NOT a merge gate. A fuzz run spends a wall-clock budget and its result is
# "nothing failed inside that budget", which is not the kind of statement a merge should
# block on. It is also the only lane here that can find a bug nobody wrote a case for, so it
# runs every night rather than when someone remembers -- the same reasoning ../mcfish gives
# for `mcfish_fuzz.yml` and for moving its node differential onto a schedule in `6bc4db61`.
#
# THREE JOBS, one per harness, each with the WHOLE budget -- the shape ../mcfish's fuzz
# workflow uses (`fuzz`, `fuzz-search`, `fuzz-tb`) and for its reason: the harnesses run at
# throughputs orders of magnitude apart, so one shared budget is really a budget for the
# fastest of them. Running them as separate jobs also means a failure in one still lets the
# other two spend their time, and the job name says which harness went red without reading a
# log. `cargo xtask fuzz <seconds> all` is the local single-process form.
#
# Actions are pinned BY COMMIT SHA with the tag in a trailing comment, as in rfish_ci.yml.

on:
  schedule:
    # 04:41 UTC, off the hour and off the sibling ports' slots, so four repositories do not
    # queue against the same runner pool.
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Budget per harness -- each of the three jobs gets this in full"
        required: false
        default: "600"
      seed:
        description: "Replay a previous run's seed (blank picks one from the clock)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    # One job per harness, from one matrix, because the three differ only in which harness
    # they name and whether they need tables. `fail-fast: false` is load-bearing: a red UCI
    # run must not cancel a tablebase run that had found nothing yet.
    name: fuzz (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mutated UCI text at the shipped binary: the surface a user types at.
          - harness: uci
            tables: false
          # Random legal positions through the real search, in-process: movegen, the move
          # picker, the transposition table, pruning, qsearch and the accumulator.
          - harness: search
            tables: false
          # Mutated table bytes at the Syzygy decoder: the only input here that is a FILE, and
          # the one no part of the process vouches for.
          - harness: tb
            tables: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        # POSIX `sed`, not `grep -oP`. `-P` is a GNU extension: macOS ships BSD grep, which
        # rejects the flag outright, and Git Bash on Windows is often built without PCRE. This
        # step runs on all three, so the portable form is the only correct one.
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The net is a runtime input and the search harness evaluates with it, so a run without
      # one would be fuzzing the classical fallback and reporting it as the engine.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - run: cargo xtask net

      # The 3-man set seeds the tablebase harness: it mutates tables that PARSE, because a
      # random blob dies at the magic number and never reaches a decoder. `continue-on-error`
      # for the same reason ../mcfish gives -- a mirror outage must not fail a fuzz job. The
      # soak then SKIPS and says so, which is a visibly weaker run rather than a false green.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.tables
        with:
          path: resources/syzygy
          key: syzygy-3man-${{ hashFiles('crates/xtask/src/net.rs') }}
      - name: Fetch the 3-man tables to seed the parse harness
        if: matrix.tables
        continue-on-error: true
        run: cargo xtask tb-fetch

      # No seed pinned on the schedule: each night walks positions the last one did not,
      # which is the entire reason to run this repeatedly. The step PRINTS the seed it chose,
      # and a failure is replayed by dispatching this workflow with it.
      - name: Fuzz
        env:
          RFISH_FUZZ_SEED: ${{ github.event.inputs.seed }}
        run: cargo xtask fuzz ${{ github.event.inputs.seconds || '600' }} ${{ matrix.harness }}
