name: rfish upstream check

# Scheduled upstream-drift detection, which both sibling ports carry and this one did not.
#
# DETECTION ONLY, and judgement-free: fetch official-stockfish/master and print how many
# commits the port is behind the SHA in `tools/upstream/UPSTREAM_BASE`, plus the subjects of
# what is missing. Porting stays a deliberate, human-gated session -- this never attempts one.
#
# It exists because the gap is otherwise invisible between sessions. rfish sat five commits
# behind, through a search retune and an NNUE change, until someone happened to compare by
# hand; two of those five moved the bench signature. Weekly detection is cheap insurance
# against the next one, and the rule this serves is upstream's own: sync at least at every
# net bump.
#
# Every action is pinned BY COMMIT SHA with the tag in a trailing comment, the same pins the
# sibling ports carry, so a bump is decided once and applied across all of them.

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Upstream master moves a few commits a week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Least privilege: detection reads this repository and upstream's history, nothing else.
permissions:
  contents: read

jobs:
  upstream-check:
    name: Detect upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: `git rev-list <pin>..<master>` needs the pinned commit to be present,
      # and a shallow checkout may not carry it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Beside the workspace, which is where every differential gate already looks for it.
      - name: Clone the golden beside the workspace
        run: git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git ../Stockfish

      - name: Report the drift and what is missing
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < tools/upstream/UPSTREAM_BASE)"
          test -n "$pin" || { echo "tools/upstream/UPSTREAM_BASE is empty"; exit 1; }

          # A pin the golden does not contain is a broken pin, not a drift of zero -- fail
          # loudly rather than reporting "up to date" for a SHA nobody can resolve.
          if ! git -C ../Stockfish cat-file -e "${pin}^{commit}" 2>/dev/null; then
            echo "UPSTREAM_BASE $pin is not a commit in upstream's history"
            exit 1
          fi

          master="$(git -C ../Stockfish rev-parse origin/master)"
          behind="$(git -C ../Stockfish rev-list --count "$pin..$master")"
          echo "pin $pin is $behind commits behind upstream master $master"

          {
            echo "## Upstream drift"
            echo ""
            echo "Pinned at \`$pin\`, **$behind commits behind** \`$master\`."
            echo ""
            if [ "$behind" -gt 0 ]; then
              echo "Missing commits, oldest first:"
              echo ""
              echo '```'
              git -C ../Stockfish log --reverse --oneline "$pin..$master"
              echo '```'
              echo ""
              echo "Porting is human-gated. Land ONE upstream commit per commit and check"
              echo "each against upstream built at THAT commit -- see docs/09-tooling-ci.md."
            else
              echo "Up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Informational, never a gate: a red merge button for upstream having moved would
      # block work that has nothing to do with the port being behind.
      - name: Note that drift detection does not gate
        run: echo "Drift detection only -- this workflow never fails for being behind."

  # A DIFFERENT question from drift: not "has upstream moved" but "is rfish still faithful to
  # the pin it already claims to match". Both need an upstream BUILD, which is why neither can
  # live in the push lanes and why this workflow -- which already clones the golden -- is
  # where they belong. Until this job existed both only ran when someone remembered.
  fidelity:
    name: Fidelity against the pinned oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned toolchain
        id: rt
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rt.outputs.channel }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/*.nnue
          key: nnue-${{ hashFiles('crates/rfish-engine/src/eval/nnue/mod.rs') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/syzygy
          key: syzygy-3man-${{ hashFiles('crates/xtask/src/net.rs') }}
      - run: cargo xtask net
      - run: cargo xtask tb-fetch

      # The oracle must be built AT THE PIN, in ../Stockfish/src, because that is where every
      # differential gate looks for it -- and `find_oracle` checks the SHA upstream stamps
      # into `id name`, so a build of master would be REJECTED rather than silently compared
      # against. Checking out the pin is therefore load-bearing, not tidiness.
      - name: Build the oracle at the pin
        run: |
          set -euo pipefail
          git clone https://github.com/official-stockfish/Stockfish.git ../Stockfish
          git -C ../Stockfish checkout --detach "$(tr -d '[:space:]' < tools/upstream/UPSTREAM_BASE)"
          # Upstream embeds the net at build time; it is the same file `cargo xtask net`
          # already fetched, so copy rather than download it twice.
          cp resources/*.nnue ../Stockfish/src/
          make -C ../Stockfish/src -j"$(nproc)" build ARCH=x86-64-avx2
          ../Stockfish/src/stockfish uci < /dev/null | head -n 1

      # The evaluation, the tablebase probes, the UCI surface and the search, in that order:
      # each answers a question the others cannot.
      - run: cargo xtask nnue-check
      - run: cargo xtask tb
      - run: cargo xtask golden-audit
      - run: cargo xtask upstream-nodes --positions 25 --depth 8

      # The call-count fingerprint: not "does rfish compute upstream's numbers" but "does it
      # get there by calling what upstream calls, as often". Every check above compares
      # VALUES and each passes over a state divergence that happens not to move one; this
      # found two on its first run. It needs an oracle AND valgrind, and it is ~50x slower
      # than the bench it profiles, which is why it lives here and not in `parity`.
      #
      # `cargo xtask oracle` builds its own tree beside the workspace, stamped with the SHA
      # it was extracted at -- the step below refuses to measure against an oracle that is
      # not at the pin, so this is not a duplicate of the build above.
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # `oracle` is `make profile-build COMP=clang`, so it needs clang++ AND the
      # llvm-profdata that merges the raw profile clang writes -- both at rustc's LLVM major,
      # or the ledger compares GCC against LLVM, or merges one LLVM's profile format with
      # another's. The runner image ships neither at that major, so the step SKIPPED and
      # exited 2, and the fingerprint behind it never ran at all.
      #
      # Derive the major from rustc rather than pinning one here: `rust-toolchain.toml` moves,
      # and a hardcoded major would go quietly stale into the loose `llvm-profdata` fallback.
      # apt.llvm.org lays the unversioned names down under /usr/lib/llvm-<major>/bin, so one
      # path prepend serves `have("clang++")`, `COMP=clang` and `profdata_tool()` together.
      - name: Install clang and llvm-profdata at rustc's LLVM major
        shell: bash
        run: |
          set -euo pipefail
          major=$(rustc -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
          test -n "$major" || { echo "rustc -vV names no LLVM version"; exit 1; }
          echo "rustc carries LLVM $major"
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$major"
          # llvm.sh installs clang; llvm-profdata comes from the llvm package beside it.
          sudo apt-get install -y "llvm-$major"
          echo "/usr/lib/llvm-$major/bin" >> "$GITHUB_PATH"

      # $GITHUB_PATH only applies to LATER steps, so assert here rather than trusting it.
      # Without this the failure mode is silent: a mismatched clang builds an oracle that is
      # not comparable, and nothing downstream says so.
      - name: Verify the majors match
        shell: bash
        run: |
          set -euo pipefail
          want=$(rustc -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
          got=$(clang++ --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -n 1)
          test "$got" = "$want" || { echo "clang++ is $got, rustc's LLVM is $want"; exit 1; }
          command -v llvm-profdata >/dev/null || { echo "no llvm-profdata on the path"; exit 1; }
          echo "clang++ $got and $(command -v llvm-profdata) match rustc's LLVM $want"

      - run: cargo xtask oracle --tier avx2
      - run: cargo xtask fingerprint --tier avx2
